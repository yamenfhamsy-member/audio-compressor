name: Cloud Stem Split

# Free GPU-less vocal separation for the Thorfin Audio app (public repo =
# unlimited Actions minutes). The app uploads audio to catbox.moe, triggers
# this workflow with the URL, polls the run, and downloads the stems artifact.
#
# Trigger (app): POST /repos/{owner}/{repo}/actions/workflows/separate.yml/dispatches
#   { ref: main, inputs: { audio_url, job_id } }

on:
  workflow_dispatch:
    inputs:
      audio_url:
        description: "Direct URL of the audio file (catbox.moe link from the app)"
        required: true
        type: string
      job_id:
        description: "Client-generated id, used in the artifact name"
        required: true
        type: string
      ext:
        description: "File extension without dot (mp3/wav/m4a/ogg/flac/mp4)"
        required: false
        default: "mp3"
        type: string
  workflow_call:
    inputs:
      audio_url:
        required: true
        type: string
      job_id:
        required: true
        type: string
      ext:
        required: false
        type: string
        default: "mp3"

jobs:
  separate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip + torch hub (demucs model)
        uses: actions/cache@v4
        with:
          path: ~/.cache
          key: demucs-cpu-${{ runner.os }}-v1
          restore-keys: demucs-cpu-

      - name: Install CPU torch + demucs
        run: |
          pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install demucs

      - name: Download audio
        run: |
          mkdir -p in out
          curl -sL --max-time 300 --max-filesize 209715200 \
            -o "in/input.${EXT}" "$AUDIO_URL"
          ls -la in/
        env:
          AUDIO_URL: ${{ inputs.audio_url }}
          EXT: ${{ inputs.ext }}

      - name: Extract audio from video containers
        run: |
          case "$EXT" in
            mp4|mov|mkv|webm)
              ffmpeg -y -i "in/input.${EXT}" -vn -ar 44100 -ac 2 "in/input.wav"
              echo "INPUT=in/input.wav" >> "$GITHUB_ENV"
              ;;
            *)
              echo "INPUT=in/input.${EXT}" >> "$GITHUB_ENV"
              ;;
          esac
        env:
          EXT: ${{ inputs.ext }}

      - name: Separate (htdemucs, vocals + instrumental)
        run: |
          python -m demucs --two-stems vocals -n htdemucs --device cpu \
            -o out "$INPUT"
          find out -name "*.wav" | head

      - name: Collect stems
        run: |
          f=$(find out -name "vocals.wav" | head -1)
          n=$(find out -name "no_vocals.wav" | head -1)
          test -n "$f" -a -n "$n"
          mkdir -p stems
          cp "$f" stems/vocals.wav
          cp "$n" stems/instrumental.wav
          ls -la stems/

      - name: Upload stems artifact
        uses: actions/upload-artifact@v4
        with:
          name: stems-${{ inputs.job_id }}
          path: stems/
          retention-days: 7
